apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-service
  namespace: cv-platform
  labels:
    app: image-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: image-service
  template:
    metadata:
      labels:
        app: image-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: image-service
          image: registry.example.com/cv-team/image-service:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: image-service-config
            - secretRef:
                name: image-service-db-credentials
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: image-data
              mountPath: /data/images
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: image-data
          persistentVolumeClaim:
            claimName: image-data-pvc
        - name: tmp
          emptyDir: {}
