apiVersion: v1
kind: ConfigMap
metadata:
  name: image-service-config
  namespace: cv-platform
data:
  IMG_DB_HOST: "postgres-svc"
  IMG_DB_PORT: "5432"
  IMG_DB_NAME: "images"
  IMG_STORAGE_BASE_DIR: "/data/images"
  IMG_PROCESSING_MAX_WORKERS: "4"
  IMG_DB_POOL_SIZE: "20"
  IMG_DB_MAX_OVERFLOW: "40"
  IMG_RETENTION_BATCH_SIZE: "200"
