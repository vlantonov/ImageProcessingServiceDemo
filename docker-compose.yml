services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      IMG_DB_USER: "${POSTGRES_USER:-postgres}"
      IMG_DB_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      IMG_DB_HOST: "db"
      IMG_DB_PORT: "5432"
      IMG_DB_NAME: "${POSTGRES_DB:-images}"
      IMG_STORAGE_BASE_DIR: "/data/images"
      IMG_PROCESSING_MAX_WORKERS: "4"
      IMG_BROKER_ENABLED: "true"
      IMG_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      IMG_KAFKA_CONSUMER_GROUP: "image-processing"
      IMG_DEBUG: "true"
    volumes:
      - image_data:/data/images
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "src.worker"]
    environment:
      IMG_DB_USER: "${POSTGRES_USER:-postgres}"
      IMG_DB_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      IMG_DB_HOST: "db"
      IMG_DB_PORT: "5432"
      IMG_DB_NAME: "${POSTGRES_DB:-images}"
      IMG_STORAGE_BASE_DIR: "/data/images"
      IMG_PROCESSING_MAX_WORKERS: "4"
      IMG_BROKER_ENABLED: "true"
      IMG_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      IMG_KAFKA_CONSUMER_GROUP: "image-processing"
      IMG_DEBUG: "true"
    volumes:
      - image_data:/data/images
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-images}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  pg_data:
  image_data:
