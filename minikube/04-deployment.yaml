apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-service
  namespace: cv-platform
  labels:
    app: image-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-service
  template:
    metadata:
      labels:
        app: image-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: image-service
          image: image-service:latest
          imagePullPolicy: Never  # use image built inside minikube's docker
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: image-service-config
            - secretRef:
                name: image-service-db-credentials
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: image-data
              mountPath: /data/images
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: image-data
          persistentVolumeClaim:
            claimName: image-data-pvc
        - name: tmp
          emptyDir: {}
